name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported Python and the one that type-checks: mypy targets 3.9, and on a
        # newer interpreter pip resolves a numpy whose stubs use 3.12-only syntax. 3.12 runs the suite.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for Qt (offscreen) and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -e ".[dev]"
      - name: Lint and types
        if: matrix.python-version == '3.9'
        run: |
          ruff check . && ruff format --check .
          mypy space_video_enhancer
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
