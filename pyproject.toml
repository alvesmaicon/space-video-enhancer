[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "space-video-enhancer"
version = "0.1.0"
description = "Offline MVP for video enhancement preview and export"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "PySide6>=6.8,<7",
]

[project.scripts]
space-video-enhancer = "main:main"

[tool.setuptools]
py-modules = ["main"]